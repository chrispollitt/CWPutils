# bidet presets: named recipes for the three tools, chosen to show what BIDeT 4D can do.  Each section is a
# preset; its keys are
#   description   one line, shown by `bidet --list-presets`
#   sample        what kind of input shows it off: text, art, picture (shaded ASCII), blocks or colour
#                 (used by gallery.py to draw the contact sheet; bidet itself works with any input)
#   bifin         flags for bifin (how the input is read)            e.g.  -m tone --levels 6
#   bifop         operations for bifop, separated by spaces          e.g.  arc:bend=0.4 crop:margin=10
#   bifout        flags for bifout (how the picture is drawn)        e.g.  --scale 6
#   solid         the 3D look: key=value words for bifop's extrude / spin / popout        e.g.  material=chrome depth=0.12
#                 (material, side, depth, hover, view=yaw+pitch+roll, bevel, perspective, shadow, fps; `bifop --list`)
#   motion        what a 3D preset does: pop (2D to 3D: pops out of the screen), spin, sway, hold, joined with +,
#                 then key=value words for the moves                                      e.g.  pop+hold+spin hold=2.4
#   uses          names of presets applied first: a showpiece made of others              e.g.  arc gold
# and every key but the description is optional.  `bidet -P arc -P matrix` combines presets: their flags and
# operations are joined in the order given, so a later one wins where they disagree.  A look without a motion is a
# still (`extrude`); with a motion it is an animation (write it as .gif, or watch it on a SIXEL terminal).  The shapes
# combine with the looks and the motions:  bidet -P wave -P rainbow -P popout "Hello"  (put the look after the motion
# if you want to change the motion's colours).  `bidet --show-pipeline` prints the bifin | bifop | bifout command line
# a recipe makes; `python gallery.py` draws them all (`--gif`: the 3D ones moving).
#
# Add your own, or change these, in ~/.config/bidet/presets.ini (or $XDG_CONFIG_HOME/bidet/presets.ini, or a file
# named by $BIDET_PRESETS).  A section there replaces the preset of the same name.
#
# The shapes work on any vector art (text, cowsay, figlet, line art).  Everything here is drawn as vectors, so
# `bidet ... -w 4000` is as crisp as `-w 400`.  The 3D and 4D presets at the end are drawn as rasters (they are solids,
# lit and shaded), at twice the size of the picture; texture and tile materials will follow when BIF has paint kinds.

[plain]
description = The art as it is
sample = art

# --- line weight ---------------------------------------------------------------------------------------------

[bold]
description = Thicker lines
sample = art
bifop = pen:1.8

[thin]
description = Thinner lines
sample = art
bifop = pen:0.6

# --- shapes: WordArt-style warps that bend the strokes and the letters ----------------------------------------

[arc]
description = Arched upward, like WordArt's Arch Up
sample = text
bifin = --face serif --bold
bifop = arc:bend=0.4 crop:margin=10

[inverted-arc]
description = A bowl: arched downward
sample = text
bifin = --face serif
bifop = arc:bend=-0.4 crop:margin=10

[squeeze]
description = Taller in the middle than at the ends
sample = text
bifin = --face sans --bold
bifop = squeeze:peak=1.5,ends=0.7 crop:margin=10

[wave]
description = A gentle ripple
sample = text
bifin = --face script
bifop = wave:amplitude=0.08,length=0.8 crop:margin=10

[up]
description = Tilted up to the right
sample = text
bifin = --face impact
bifop = skew:y=-15 crop:margin=8

[italic]
description = Leaning to the right
sample = text
bifop = skew:x=14 crop:margin=8

[tilt]
description = Turned a little, like a sticker
sample = art
bifop = rotate:-8 crop:margin=8

[mirror]
description = Left to right
sample = art
bifop = flip:h

[banner]
description = A bold, swelling banner
sample = text
bifin = --face impact
bifop = squeeze:peak=1.7,ends=0.9 pen:2 crop:margin=10

[monument]
description = A heavy arch, carved in stone
sample = text
bifin = --face serif --bold
bifop = arc:bend=0.3 pen:2.4 theme:ink=#4a4540,paper=#d8d2c4 crop:margin=12

# --- colours: ink on paper -----------------------------------------------------------------------------------

[matrix]
description = Green on black
sample = art
bifop = theme:ink=#33ff66,paper=#001a08

[amber]
description = Amber on dark brown, like an old monitor
sample = art
bifop = theme:ink=#ffb000,paper=#1a1000

[blueprint]
description = White lines on blueprint blue
sample = art
bifop = pen:1.2 theme:ink=#ffffff,paper=#1a3a8a

[paper]
description = Dark ink on cream paper
sample = art
bifop = theme:ink=#222222,paper=#f4ecd8

[neon]
description = Cyan glow colours on near black
sample = text
bifop = pen:1.5 theme:ink=#00ffd5,paper=#0a0014

[chalk]
description = Chalk on a green board
sample = text
bifin = --face comic
bifop = pen:1.4 theme:ink=#f2f2e6,paper=#2b3a33

[stamp]
description = A red rubber stamp, a little crooked
sample = text
bifin = --face impact
bifop = pen:2.2 rotate:-6 theme:ink=#b3261e,paper=#f6efe0 crop:margin=10

[sunset]
description = Rose on cream
sample = text
bifin = --face script
bifop = pen:1.4 theme:ink=#d4546a,paper=#fdf3d4

[ghost]
description = Pale and see-through
sample = text
bifop = pen:1.4 opacity:0.45

# --- picture-style art: shaded ASCII (jp2a, chafa) traced into lines ---------------------------------------

[sketch]
description = Picture art as a pen sketch: outlines and a few contour lines
sample = picture
bifin = -m tone --levels 2
bifop = pen:0.9

[trace]
description = Picture art as clean outlines only
sample = picture
bifin = -m tone --levels 0
bifop = pen:1.2 theme:ink=#222222,paper=#fffdf5

[contour]
description = Picture art as a topographic map
sample = picture
bifin = -m tone --levels 8
bifop = pen:0.7 theme:ink=#8a4b2a,paper=#f1e6cf

# --- other kinds of input and output --------------------------------------------------------------------------

[pixels]
description = Block and half-block art as the crisp coloured picture it is
sample = blocks
bifin = -m ansi-block

[mono]
description = One colour, even if the art has ANSI colours
sample = colour
bifin = --mono

[huge]
description = Drawn six times life size: the lines stay sharp
sample = art
bifout = --scale 6

# --- 3D: the look of a solid.  Each is a still; add a motion (popout, turntable, swing, rise) to make it move, ----
# --- or a shape (arc, squeeze, wave, up ...) to bend it first.  `tall` is WordArt's taller letters --------------

[chrome]
description = Polished chrome letters, extruded
sample = text
bifin = --face serif --bold
bifop = crop:margin=10
solid = material=chrome depth=0.12 tall=1.2

[rainbow]
description = A rainbow, extruded and lit
sample = text
bifin = --face sans --bold
bifop = crop:margin=10
solid = material=rainbow depth=0.12 tall=1.4

[gold]
description = Solid gold block letters
sample = text
bifin = --face impact
bifop = crop:margin=10
solid = material=gold depth=0.16 tall=1.2

[superhero]
description = Yellow to red, leaning up, deep
sample = text
bifin = --face impact
bifop = skew:y=-12 crop:margin=10
solid = material=superhero depth=0.15 tall=1.4

[dusk]
description = Cream to rose on deep blue sides
sample = text
bifin = --face serif --bold
bifop = crop:margin=10
solid = material=sunset depth=0.14 tall=1.2

[lagoon]
description = Periwinkle to teal, grey sides
sample = text
bifin = --face serif --bold
bifop = crop:margin=10
solid = material=aqua depth=0.1

[cobalt]
description = Blue faces on deep red sides
sample = text
bifin = --face impact
bifop = crop:margin=10
solid = material=cobalt depth=0.18 tall=1.2

[graphite]
description = A slab of brushed graphite
sample = text
bifin = --face impact
bifop = crop:margin=10
solid = material=graphite depth=0.45 view=-25+6+0 tall=1.2

[brick]
description = Dark red faces, glowing orange sides
sample = text
bifin = --face sans --bold
bifop = skew:y=8 crop:margin=10
solid = material=brick depth=0.3

[horizon]
description = Sky, sun and sea in one face
sample = text
bifin = --face sans --bold
bifop = crop:margin=10
solid = material=horizon depth=0.12

[lime]
description = Acid green on navy sides
sample = text
bifin = --face sans --bold
bifop = skew:y=-8 crop:margin=10
solid = material=lime depth=0.12

[relief]
description = Line art as a solid: the strokes, extruded
sample = art
bifop = pen:2.4 crop:margin=10
solid = material=cornflower depth=0.35 view=-25+8+0

# --- 4D: motions (the picture moves: a GIF, or live on a SIXEL terminal).  All last 8 s or a divisor of it, so ----
# --- they loop together on the gallery sheet.  Each uses a look; put another look after one to change its colours -

[popout]
description = 2D to 3D: it pops out of the screen, rests, then turns
sample = text
uses = rainbow
motion = pop+hold+spin hold=2.4

[turntable]
description = Turns steadily about the vertical axis
sample = text
uses = chrome
motion = spin

[swing]
description = Swings to and fro like a shop sign
sample = text
uses = gold
motion = sway time=4 degrees=30

[rise]
description = It lifts off the screen and stays up, on its shadow
sample = text
uses = superhero
motion = pop+hold hold=6.4

# --- showpieces: a shape, a look and a motion, made of other presets -----------------------------------------------

[marquee]
description = A golden arch, extruded
sample = text
uses = arc gold

[bubble]
description = Swollen impact letters in superhero colours
sample = text
uses = squeeze superhero

[ripple]
description = A rippling banner in dusk colours
sample = text
uses = wave dusk

[skyline]
description = Cobalt letters climbing to the right
sample = text
uses = up cobalt

[reveal]
description = A chrome arch pops out of the screen and turns
sample = text
uses = arc popout chrome

[carnival]
description = A rippling rainbow, turning
sample = text
uses = wave turntable rainbow
